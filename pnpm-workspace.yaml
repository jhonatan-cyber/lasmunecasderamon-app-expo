packages:
  - packages/*

nodeLinker: hoisted

allowBuilds:
  '@sentry/cli': false
  esbuild: false
  unrs-resolver: false

overrides:
  '@expo/cli>zod': '>=4.6.6 <5'
  '@expo/ngrok>uuid': '>=11.1.1 <12'
  '@humanfs/node': '>=0.16.8'
  '@xmldom/xmldom': '>=0.9.12'
  baseline-browser-mapping: '>=2.11.0'
  brace-expansion@^1: '>=1.1.21 <2'
  brace-expansion@^5: '>=5.0.12 <6'
  browserslist: '>=4.28.7'
  compression: '>=1.8.2'
  decode-uri-component: '>=0.5.1'
  esbuild: '>=0.28.1'
  'expo-splash-screen>@expo/config-plugins': '57.0.11'
  fast-uri: '>=3.1.2'
  flatted: '>=3.4.1'
  follow-redirects: '>=1.16.0'
  glob@^13: '>=14.0.4 <15'
  js-yaml: '>=4.3.2 <5'
  minimatch@^10: '>=11.0.5 <12'
  nanoid@^3: '>=3.3.18 <4'
  node-forge: '>=1.4.3 <2'
  picomatch: '^2.3.2'
  postcss: '>=8.5.23 <9'
  qs: '>=6.16.1 <7'
  shell-quote: '>=1.11.0'
  source-map-js: '>=1.2.2'
  tar: '>=7.5.11'
  undici: '>=8.10.2 <9'
  uuid@^11: '>=11.1.1 <12'
  ws: '>=8.21.0 <9'

permissions:
  expo-sqlite:
    skills: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.22'
  - '@expo/config-plugins@58.0.14'
  - '@expo/config@58.0.13'
  - '@expo/fingerprint@0.22.0'
  - '@expo/inline-modules@0.2.11'
  - '@expo/local-build-cache-provider@58.0.13'
  - '@expo/metro-config@58.0.24'
  - '@expo/metro-file-map@58.0.7'
  - '@expo/prebuild-config@58.0.21'
  - '@expo/router-server@58.0.24'
  - babel-preset-expo@58.0.27
  - expo-file-system@58.0.15
  - expo-modules-core@58.2.0
  - expo-modules-jsi@58.0.24
  - expo@58.1.0
  - expo-dev-client@58.0.22
  - expo-dev-launcher@58.1.0
  - expo-glass-effect@58.0.6
  - expo-image@58.0.19
  - expo-network@58.0.6
  - expo-notifications@58.1.10
  - expo-router@58.0.33
  - expo-sharing@58.0.24
  - expo-splash-screen@58.0.15
  - expo-updates@58.0.23
