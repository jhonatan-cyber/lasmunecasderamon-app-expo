name: App CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 🍏 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 🛠 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint
        continue-on-error: true

      - name: 🚀 Publish Update (CD)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --auto
