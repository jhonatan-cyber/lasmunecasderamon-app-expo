name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview_apk'
        type: choice
        options:
          - preview_apk
          - production

jobs:
  build:
    name: 🏗 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🍏 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 🛠 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          packager: pnpm

      - name: 🔐 Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error title=EXPO_TOKEN no configurado::Falta el secreto EXPO_TOKEN. Sigue docs/ROTACION_EXPO_TOKEN.md y relanza el workflow."
            exit 1
          fi

          if ! account=$(eas whoami 2>&1); then
            printf '%s\n' "$account"
            echo "::error title=EXPO_TOKEN invalido::El secreto EXPO_TOKEN no autentica con Expo. Rótalo siguiendo docs/ROTACION_EXPO_TOKEN.md y relanza el workflow."
            exit 1
          fi

          echo "EAS autenticado como: $account"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
