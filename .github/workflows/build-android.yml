name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview_apk'
        type: choice
        options:
          - preview_apk
          - production

jobs:
  build:
    name: 🏗 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 🍏 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 🛠 Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: 24.12.1
          packager: pnpm

      - name: 🔐 Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/verify-expo-token.sh

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
