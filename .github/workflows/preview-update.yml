name: Publish Preview OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Description of the preview update'
        required: true
        default: 'Manual preview update'
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish preview OTA
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_BASE_URL: https://dashboard.xn--lasmuecasderamon-bub.com
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: 24.12.1
          packager: pnpm

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/verify-expo-token.sh

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Publish preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --branch preview-testers --environment preview --message "$UPDATE_MESSAGE" --auto
