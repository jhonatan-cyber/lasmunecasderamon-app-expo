name: Publish Preview OTA

on:
  workflow_run:
    workflows: ['App Quality']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      message:
        description: 'Description of the preview update'
        required: false
        default: 'Manual preview update'
        type: string

permissions:
  contents: read

concurrency:
  group: expo-preview-update
  cancel-in-progress: false

jobs:
  publish:
    name: Publish preview OTA
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      EXPO_PUBLIC_API_BASE_URL: https://dashboard.xn--lasmuecasderamon-bub.com
      UPDATE_MESSAGE: ${{ github.event.workflow_run.head_commit.message || inputs.message || 'Preview update' }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: 24.12.1
          packager: pnpm

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/verify-expo-token.sh

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Publish preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --branch preview-testers --environment preview --message "$UPDATE_MESSAGE" --auto
